name: lint

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Ruff (lint + format check)
        run: |
          uv run ruff check .
          uv run ruff format --check .

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck bin/htpc-power-key bin/htpc-focus-kodi bin/htpc-autostart-kodi bin/htpc-common.sh install.sh
