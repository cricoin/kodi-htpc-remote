# GNOME Shell 42 can enter a loop logging "JS callback during garbage collection"
# ~3000 lines/s, which filled the root disk (a 27 GB syslog in one real incident). Drop these lines.
if $programname == "gnome-shell" and (
     $msg contains "during garbage collection" or
     $msg contains "The offending callback was" or
     $msg contains "== Stack trace for context" or
     $msg contains "[ == Stack trace for context"
   ) then stop
